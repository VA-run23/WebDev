<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CheckBox</title>
    </head>
    <body>
        <form action="/server">
            <input type="Checkbox" id="age" name="age">
            <label for="age">I am 18+</label>
            <div>
                <input type="radio" name="Fruit" id="apple" value="apple">
                <label for="apple">apple</label>
                <input type="radio" name="Fruit" id="Mango" value="Mango">
                <label for="Mango">Mango</label>
                <input type="radio" name="Fruit" id="Banana" value="Banana">
                <label for="Banana">Banana</label>
                <button>Submit</button>
            </div>
            <div>
                <input type="Checkbox" id="English" name="Sub" value="eng" >
                <label for="English">English</label>
                <input type="Checkbox" id="Hindi" name="Sub" value="Hindi">
                <label for="Hindi">Hindi</label>
                <input type="Checkbox" id="Kannada" name="Sub" value="Kannada">
                <label for="Kannada">Kannada</label>
            <button>SUBMIT</button>
            </div>
        </form>

    </body>
</html>
