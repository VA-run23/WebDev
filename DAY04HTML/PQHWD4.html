<!--Practice Question 2-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Question 2</title>
</head>
<body>
    <form>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" >
        </div>
        <br>
        <div>
            <label for="sex">Sex:</label>
            <input type="radio" name="sex" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="sex" id="female" value="female">
            <label for="female">Female</label>
         
         
        </div>
        <br>
        <div>
            Country:
            <select name="country" id="country">
                <option>Select an option</option>
                <option value="India">India</option>
                <option value="South Africa">South Africa</option>
                <option value="Sri Lanka">Sri Lanka</option>
                <option value="USA">USA</option>
        </div>
        <br/>
        <div><br>
            <label>
                <label for="Message">Message:</label>
                <textarea  name="Message" rows="5" cols="50" id="Message"></textarea>
            </label>
        </div>
        <br><br>
        <div>
            <input type="checkbox" id="Subscibe" >
            <label for="Subscibe">Subscibe?</label>
        </div>
        <br>
        <button>Submit</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Question 3</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <form>
        <label for="Name">Name:</label>
        <input type="text" id="name" placeholder="Write your name"?>
        <br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Write your email"?>
        
        <br>
        <label for="Message"> Message: </label>
        <textarea id="Message"></textarea>

        <div>
            Rate us out of 5:<br>
            <input type="radio" id="1" name="rating" value="1">
            <label for="1">1</label>
            <br>
            <input type="radio" id="2" name="rating" value="2">
            <label for="2">2</label>
            <br>
            <input type="radio" id="3" name="rating" value="3">
            <label for="3">3</label>
            <br>
            <input type="radio" id="4" name="rating" value="4">
            <label for="4">4</label>
            <br>
            <input type="radio" id="5" name="rating" value="5">
            <label for="5">5</label>
            <br>
        </div>
        <button>Send your Message</button>
    </form>
    
</body>
</html>
