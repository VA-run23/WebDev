<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Table</title>
    </head>
<body>
    <table>
        <caption>Food Menu</caption>
            <thead>
                <tr>
                    <th>Item </th>
                    <th>Price </th>
                    &nbsp;
                    &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;
                    <th>Total</th>
                </tr>
            </thead>
       
            <tbody>
                <tr>
                    <td>Orange</td>
                    <td>20</td>
                </tr> 
                <tr>
                    <td>Jackfruit</td>
                    <td>15</td>
               <tr>
                    <td>Mango</td>
                    <td>10</td>
                </tr>  </tr>
                <tr>   
                    <td>Dragon Fruit</td>
                    <td>25</td>
                </tr>
            </tbody>
    </table> 
</body>
</html>
